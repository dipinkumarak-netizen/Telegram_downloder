<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Administrator Login · Telegram Media Downloader</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1220;--card:#151f31;--muted:#91a0b8;--bad:#ff6b7a;--accent:#55a7ff}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:#edf4ff;font:15px system-ui,sans-serif}
    main{width:min(420px,calc(100% - 28px))}.card{background:var(--card);border:1px solid #26344c;border-radius:14px;padding:28px}h1{font-size:21px;margin:0 0 8px}h2{font-size:17px;margin:0 0 22px;color:var(--muted);font-weight:500}
    label{display:block;margin-top:14px}input{display:block;width:100%;padding:11px;margin-top:6px;border:1px solid #40526e;border-radius:7px;background:#0d1728;color:#edf4ff}button{width:100%;margin-top:20px;border:0;border-radius:7px;padding:11px;background:var(--accent);cursor:pointer}.message{min-height:21px;margin:14px 0 0;color:var(--bad)}
  </style>
</head>
<body><main><div class="card">
  <h1>Telegram Media Downloader</h1>
  <h2>Administrator Login</h2>
  <form id="login-form">
    <label for="username">Username<input id="username" name="username" autocomplete="username" required autofocus></label>
    <label for="password">Password<input id="password" name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit">Sign In</button>
    <p id="message" class="message" role="alert"></p>
  </form>
</div></main><script>
const nextPath={{ next_path|tojson }};
document.getElementById("login-form").addEventListener("submit",async event=>{
  event.preventDefault();
  const message=document.getElementById("message");
  message.textContent="";
  const password=document.getElementById("password");
  try{
    const response=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:document.getElementById("username").value,password:password.value})});
    password.value="";
    if(!response.ok){const data=await response.json();throw new Error(data.detail||"Sign in failed.")}
    location.assign(nextPath);
  }catch(error){password.value="";message.textContent=error.message}
});
</script></body></html>
