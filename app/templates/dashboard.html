<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Telegram Downloader</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1220;--card:#151f31;--muted:#91a0b8;--good:#44d19d;--bad:#ff6b7a;--accent:#55a7ff}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:#edf4ff;font:14px system-ui,sans-serif}
    main{max-width:1200px;margin:auto;padding:24px}.head{display:flex;justify-content:space-between;align-items:center}
    h1{font-size:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
    .card{background:var(--card);border:1px solid #26344c;border-radius:12px;padding:16px}.value{font-size:23px;margin-top:6px}
    .muted{color:var(--muted)}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{text-align:left;padding:10px;border-bottom:1px solid #26344c}
    .scroll{overflow:auto}.bar{width:140px;background:#26344c;height:8px;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
    button{border:0;border-radius:6px;padding:6px 9px;cursor:pointer}.danger{background:var(--bad)}.retry{background:var(--accent)}.secondary{background:#334663;color:#edf4ff}
    .ok{color:var(--good)}.bad{color:var(--bad)}pre{white-space:pre-wrap;max-height:220px;overflow:auto}
    @media(max-width:650px){main{padding:12px}th:nth-child(3),td:nth-child(3){display:none}}
  </style>
</head>
<body><main>
  <div class="head"><h1>Telegram Media Downloader</h1><span id="connection"></span></div>
  <section class="grid">
    <div class="card"><span class="muted">Queue</span><div class="value" id="queue">—</div></div>
    <div class="card"><span class="muted">Completed</span><div class="value" id="completed">—</div></div>
    <div class="card"><span class="muted">Failed</span><div class="value" id="failed">—</div></div>
    <div class="card"><span class="muted">Disk free</span><div class="value" id="disk">—</div></div>
    <div class="card"><span class="muted">Downloaded</span><div class="value" id="total">—</div></div>
  </section>
  <section class="card" style="margin-top:12px"><h2>Downloads</h2><div class="scroll"><table>
    <thead><tr><th>File</th><th>Status</th><th>Progress</th><th>Speed</th><th>Action</th></tr></thead><tbody id="jobs"></tbody>
  </table></div></section>
  <section class="card" style="margin-top:12px">
    <div class="head">
      <h2>Recent events</h2>
      <button class="secondary" onclick="clearHistory()">Clear history</button>
    </div>
    <p class="muted">Clears completed, failed, and cancelled entries plus event logs. Active downloads stay intact.</p>
    <pre id="events"></pre>
  </section>
</main><script>
const size=n=>{if(!n)return"0 B";const u=["B","KB","MB","GB","TB"],i=Math.min(Math.floor(Math.log(n)/Math.log(1024)),4);return`${(n/1024**i).toFixed(i?1:0)} ${u[i]}`}
async function action(id,name){await fetch(`/api/downloads/${id}/${name}`,{method:"POST"});refresh()}
async function clearHistory(){if(!confirm("Clear completed, failed, and cancelled history from the dashboard?"))return;const r=await fetch("/api/history/clear",{method:"POST"});if(!r.ok){connection.innerHTML='<span class="bad">● Clear failed</span>';return}refresh()}
async function refresh(){try{const r=await fetch("/api/status");if(!r.ok)return;const d=await r.json(),c=d.stats.counts;
document.querySelector("#connection").innerHTML=d.telegram_connected?'<span class="ok">● Telegram connected</span>':'<span class="bad">● Disconnected</span>';
queue.textContent=d.queue_size;completed.textContent=c.completed||0;failed.textContent=c.failed||0;disk.textContent=size(d.disk.free);total.textContent=size(d.stats.total_downloaded);
jobs.innerHTML=d.jobs.map(j=>`<tr><td>${esc(j.original_filename)}<br><small class="muted">${size(j.downloaded_bytes)} / ${size(j.file_size)}</small></td><td>${j.state}</td><td><div class="bar"><i style="width:${j.progress}%"></i></div>${j.progress.toFixed(1)}%</td><td>${size(j.speed_bps)}/s</td><td>${["queued","downloading"].includes(j.state)?`<button class="danger" onclick="action(${j.id},'cancel')">Cancel</button>`:["failed","cancelled"].includes(j.state)?`<button class="retry" onclick="action(${j.id},'retry')">Retry</button>`:""}</td></tr>`).join("");
events.textContent=d.events.map(e=>`${e.created_at} ${e.level} ${e.message}`).join("\n")}catch(e){connection.innerHTML='<span class="bad">● Dashboard error</span>'}}
function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML}refresh();setInterval(refresh,3000);
</script></body></html>
