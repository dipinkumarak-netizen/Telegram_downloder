<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Application Settings · Telegram Media Downloader</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1220;--card:#151f31;--muted:#91a0b8;--good:#44d19d;--bad:#ff6b7a;--accent:#55a7ff}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:#edf4ff;font:14px system-ui,sans-serif}main{max-width:900px;margin:auto;padding:24px}.head{display:flex;justify-content:space-between;align-items:center;gap:16px}.card{background:var(--card);border:1px solid #26344c;border-radius:12px;padding:18px;margin:12px 0}h1{font-size:24px}h2{font-size:18px;margin-top:0}.muted{color:var(--muted)}.good{color:var(--good)}.bad{color:var(--bad)}label{display:block;margin:10px 0}input{display:block;width:100%;padding:10px;margin-top:5px;border:1px solid #40526e;border-radius:7px;background:#0d1728;color:#edf4ff}input[type=checkbox]{display:inline;width:auto}button,.link{border:0;border-radius:7px;padding:9px 13px;cursor:pointer;background:var(--accent);color:#081321;text-decoration:none}.secondary{background:#334663;color:#edf4ff}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.disk,.source{padding:11px;border:1px solid #334663;border-radius:8px;margin:8px 0}.source{display:flex;gap:10px}.message{min-height:20px}
  </style>
</head>
<body><main>
  <div class="head"><div><h1>Application Settings</h1><p class="muted">Manage the configured application.</p></div><div class="row"><a class="link secondary" href="/">Dashboard</a><button class="secondary" id="logout">Log Out</button></div></div>
  <p id="message" class="message muted">Loading settings…</p>
  <section class="card"><h2>Telegram API</h2><label>API ID<input id="api-id" inputmode="numeric"></label><label>API Hash <span id="hash-state" class="good"></span><input id="api-hash" type="password" autocomplete="new-password" placeholder="Enter only to replace"></label><button id="save-api">Save Telegram API</button></section>
  <section class="card"><h2>Storage</h2><p id="storage-current"></p><div id="disks"></div></section>
  <section class="card"><h2>Jellyfin</h2><label><input id="jellyfin-enabled" type="checkbox"> Enable Jellyfin refresh</label><label>URL<input id="jellyfin-url"></label><label>API key <span id="key-state" class="good"></span><input id="jellyfin-key" type="password" autocomplete="new-password" placeholder="Enter only to replace"></label><div class="row"><button id="save-jellyfin">Save Jellyfin</button><button class="secondary" id="test-jellyfin">Test Connection</button></div></section>
  <section class="card"><h2>Telegram Account</h2><p id="telegram-state" class="muted"></p></section>
  <section class="card"><h2>Telegram Sources</h2><p class="muted">Choose the channels and groups monitored for downloads.</p><div class="row"><button class="secondary" id="refresh-sources">Refresh</button><button class="secondary" id="clear-sources">Clear All</button></div><div id="sources"></div><button id="save-sources">Save Sources</button></section>
</main><script>
let csrf="",state={},sourceItems=[];const message=document.getElementById("message");
function note(text,bad=false){message.textContent=text;message.className=`message ${bad?"bad":"muted"}`}
function login(){location.assign("/login?next=/settings")}
async function api(url,options={}){const headers={"Content-Type":"application/json",...(options.headers||{})};if(csrf)headers["X-CSRF-Token"]=csrf;const response=await fetch(url,{...options,headers});if(response.status===401){login();throw new Error("Session expired")};const data=await response.json();if(!response.ok)throw new Error(data.detail?.message||data.detail||"Request failed");return data}
const post=(url,payload)=>api(url,{method:"POST",body:payload===undefined?undefined:JSON.stringify(payload)});
async function load(){try{state=await api("/api/setup/status");csrf=state.csrf_token;if(!state.authenticated)return login();document.getElementById("api-id").value=state.telegram_api_id||"";document.getElementById("hash-state").textContent=state.telegram_api_configured?"Configured":"";const jellyfin=state.jellyfin||{};document.getElementById("jellyfin-enabled").checked=Boolean(jellyfin.enabled);document.getElementById("jellyfin-url").value=jellyfin.url||"";document.getElementById("key-state").textContent=jellyfin.api_key_configured?"Configured":"";document.getElementById("storage-current").textContent=state.storage_root?`Current disk: ${state.storage_display_name||state.storage_root}`:"No storage disk selected.";await Promise.all([loadDisks(),loadTelegram(),loadSources()]);note("Settings loaded.")}catch(error){if(error.message!=="Session expired")note(error.message,true)}}
async function loadDisks(){const data=await api("/api/storage/disks");document.getElementById("disks").innerHTML=data.disks.map((disk,index)=>`<div class="disk"><strong>${esc(disk.display_name)}</strong> · ${esc(disk.mount_path)} <button class="secondary choose-disk" data-index="${index}" ${disk.writable?"":"disabled"}>Use Disk</button></div>`).join("");document.querySelectorAll(".choose-disk").forEach(button=>button.onclick=async()=>{try{await post("/api/setup/storage-disk",{mount_path:data.disks[Number(button.dataset.index)].mount_path});await load();note("Storage updated. Apply/restart required.")}catch(error){note(error.message,true)}})}
async function loadTelegram(){const data=await api("/api/telegram/status");document.getElementById("telegram-state").textContent=data.authorized?`Connected: ${data.display_name||data.username||"Telegram account"}`:"Telegram account is not connected."}
function renderSources(){document.getElementById("sources").innerHTML=sourceItems.map(source=>`<label class="source"><input type="checkbox" data-source="${source.id}" ${source.selected?"checked":""}><span><strong>${esc(source.title)}</strong><br><small class="muted">${esc(source.type)}</small></span></label>`).join("")||'<p class="muted">No sources available.</p>';document.querySelectorAll("[data-source]").forEach(input=>input.onchange=()=>{const source=sourceItems.find(item=>String(item.id)===input.dataset.source);if(source)source.selected=input.checked})}
async function loadSources(refresh=false){const data=await api(`/api/telegram/sources${refresh?"?refresh=true":""}`);sourceItems=data.sources;renderSources()}
function esc(value){const node=document.createElement("span");node.textContent=value??"";return node.innerHTML}
document.getElementById("save-api").onclick=async()=>{try{await post("/api/setup/telegram-config",{api_id:Number(document.getElementById("api-id").value),api_hash:document.getElementById("api-hash").value});document.getElementById("api-hash").value="";note("Telegram API settings saved.")}catch(error){note(error.message,true)}};
function jelly(){return{enabled:document.getElementById("jellyfin-enabled").checked,url:document.getElementById("jellyfin-url").value,api_key:document.getElementById("jellyfin-key").value||null}}
document.getElementById("save-jellyfin").onclick=async()=>{try{await post("/api/setup/jellyfin",jelly());document.getElementById("jellyfin-key").value="";note("Jellyfin settings saved.")}catch(error){note(error.message,true)}};document.getElementById("test-jellyfin").onclick=async()=>{try{const data=await post("/api/setup/jellyfin/test",jelly());note(data.ok?"Jellyfin connection succeeded.":"Jellyfin connection failed.",!data.ok)}catch(error){note(error.message,true)}};
document.getElementById("refresh-sources").onclick=()=>loadSources(true).then(()=>note("Sources refreshed.")).catch(error=>note(error.message,true));document.getElementById("clear-sources").onclick=()=>{sourceItems.forEach(source=>source.selected=false);renderSources()};document.getElementById("save-sources").onclick=async()=>{try{await api("/api/settings/telegram-sources",{method:"PUT",body:JSON.stringify({source_ids:sourceItems.filter(source=>source.selected).map(source=>source.id)})});note("Telegram sources saved.")}catch(error){note(error.message,true)}};
document.getElementById("logout").onclick=async()=>{try{await post("/api/admin/logout");location.assign("/login")}catch(error){note(error.message,true)}};load();
</script></body></html>
