name: telegram-media-downloader

services:
  telegram-downloader:
    image: ${TMD_IMAGE:-ghcr.io/dipinkumarak-netizen/telegram-downloder:latest}
    restart: unless-stopped
    init: true
    user: "${TMD_UID:-1000}:${TMD_GID:-1000}"
    environment:
      TZ: ${TZ:-Etc/UTC}
      TMD_DATA_DIR: /data
      TMD_DATABASE_PATH: /data/database/downloads.db
      TMD_SESSION_DIR: /data/session
      TMD_CONFIG_DIR: /data/config
      TMD_LOG_DIR: /data/logs
      TMD_TEMP_DIR: /data/tmp
      TMD_DOWNLOAD_DIR: /downloads
      TMD_STORAGE_BROWSE_CONTAINER_ROOT: /host-storage
      TMD_WEB_HOST: 0.0.0.0
      TMD_WEB_PORT: 8787
      TMD_COOKIE_SECURE: ${TMD_COOKIE_SECURE:-false}
    ports:
      - "${TMD_BIND_ADDRESS:-0.0.0.0}:${TMD_HTTP_PORT:-8787}:8787"
    volumes:
      - ${TMD_DATA_HOST_DIR:-/var/lib/telegram-media-downloader}:/data
      - ${TMD_DOWNLOAD_HOST_DIR:-/srv/telegram-media-downloader/downloads}:/downloads
      - ${TMD_STORAGE_BROWSE_HOST_ROOT:-/storage}:/host-storage:rw
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
